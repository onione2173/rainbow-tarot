  <script src="/assets/auth.js"></script>
  <script>
    async function initMypage() {
      let user = await getUser();
      // 카카오 로그인은 기본적으로 /mypage/ 로 복귀(signInWithKakao 기본 redirect).
      // OAuth 복귀(#access_token 등)인데 세션이 아직 안 서면 최대 5초까지 재확인.
      if (!user) {
        const isAuthReturn = window.location.hash.includes('access_token') ||
                             new URLSearchParams(window.location.search).has('code');
        if (isAuthReturn) {
          for (let i = 0; i < 10 && !user; i++) {
            await new Promise(r => setTimeout(r, 500));
            user = await getUser();
          }
        }
      }
      if (typeof gtag === 'function') gtag('event', 'mypage_view', { logged_in: !!user });

      if (!user) {
        document.getElementById('authGate').style.display = 'block';
        return;
      }

      document.getElementById('mainContent').style.display = 'block';

      // Profile
      const meta = user.user_metadata || {};
      const name = meta.full_name || meta.name || meta.preferred_username || '사용자';
      const email = user.email || '';
      const avatar = meta.avatar_url || meta.picture || '';

      document.getElementById('profileName').textContent = name;
      document.getElementById('profileEmail').textContent = email;

      const avatarEl = document.getElementById('profileAvatar');
      if (avatar) {
        avatarEl.innerHTML = `<img src="${avatar}" alt="">`;
      }

      // Load reading history (completed + pending)
      if (window._sb) {
        const { data: readings } = await window._sb
          .from('reading_history')
          .select('*')
          .eq('user_id', user.id)
          .order('created_at', { ascending: false })
          .limit(20);

        if (readings && readings.length > 0) {
          const now = Date.now();
          // 만료된 미완료 항목 제외
          const visible = readings.filter(r => {
            if ((r.status === '결제 필요' || r.status === '결제 대기' || r.status === '결제 완료' || r.status === '생성 중' || r.status === '오류') && r.expires_at) {
              return new Date(r.expires_at).getTime() > now;
            }
            return true;
          });

          if (visible.length > 0) {
            const list = document.getElementById('historyList');
            list.innerHTML = visible.map((r, i) => {
              // '결제 대기' = 결제창을 열었으나 아직 미완료(취소 또는 확정 전). '결제 필요'와 동일하게 재결제 유도.
              const isPending = r.status === '결제 필요' || r.status === '결제 대기';
              // '결제 완료' = 결제 확정 직후 생성 시작 전 짧은 과도상태. '생성 중'과 동일하게 표시.
              const isGenerating = r.status === '생성 중' || r.status === '결제 완료';
              const isError = r.status === '오류';
              const title = escHtml(r.spread_type || r.reading_type || '리딩');
              const petName = r.pet_name ? ` — ${escHtml(r.pet_name)}` : '';
              const badge = isPending
                ? `<span class="badge-pending">결제 필요</span>`
                : isGenerating ? `<span class="badge-pending" style="color:#a0d8ff;border-color:rgba(100,180,255,.35);background:rgba(100,180,255,.08)">생성 중</span>`
                : isError ? `<span class="badge-pending" style="color:#f09090;border-color:rgba(240,100,100,.35);background:rgba(240,100,100,.08)">오류</span>`
                : '';
              const expireStr = (isPending || isGenerating || isError) && r.expires_at
                ? `<div class="history-item-expires">보관 만료: ${new Date(r.expires_at).toLocaleDateString('ko-KR')}</div>`
                : '';
              const actionBtn = isPending
                ? `<button class="btn-resume" onclick="resumeReading(${i})">이어서 결제하기</button>`
                : isGenerating
                  ? `<button class="btn-resume" onclick="checkGenerating(${i})" style="background:rgba(100,180,255,.12);color:#a0d8ff;border-color:rgba(100,180,255,.3)">완료됐는지 확인하기</button>`
                : isError
                  ? `<button class="btn-resume" onclick="resumeReading(${i})" style="background:rgba(200,160,255,.12);color:#c8a8f0;border-color:rgba(200,160,255,.3)">다시 시도하기</button>`
                : r.full_reading
                  ? `<button class="btn-view" onclick="toggleReading(${i})">다시 보기</button>`
                  : '';
              const expandDiv = (!isPending && r.full_reading)
                ? `<div class="reading-expand" id="expand-${i}">${renderMd(r.full_reading)}</div>`
                : '';
              return `
                <div class="history-item">
                  <div class="history-item-title">${title}${petName}${badge}</div>
                  <div class="history-item-meta">${new Date(r.created_at).toLocaleDateString('ko-KR')}</div>
                  ${expireStr}
                  ${actionBtn}
                  ${expandDiv}
                </div>
              `;
            }).join('');
            window._readings = visible;
          }
        }
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMd(text) {
      return escHtml(text)
        .replace(/^## (.+)$/gm, '<strong style="display:block;margin-top:14px;color:#e8c4ff">$1</strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    function resumeReading(idx) {
      if (typeof gtag === 'function') gtag('event', 'reading_resumed');
      const r = window._readings?.[idx];
      if (!r || !r.full_reading) return;
      let snap;
      try { snap = JSON.parse(r.full_reading); } catch { return; }
      if (!snap._pending) return;
      localStorage.setItem('petarot_dr', JSON.stringify({
        ...snap,
        readingId: r.id, // 결제 후 오류 재시도 시 기존 레코드를 이어받기 위함
        _pending: undefined,
        _resumePending: true,
        _savedAt: Date.now()
      }));
      window.location.href = '/deep-reading/';
    }

    async function checkGenerating(idx) {
      const r = window._readings?.[idx];
      if (!r?.id) return;
      const { data } = await window._sb.from('reading_history').select('status,full_reading').eq('id', r.id).single();
      if (!data) return;
      if (data.status === 'completed') {
        window.location.reload();
      } else {
        alert('아직 생성 중이에요. 잠시 후 다시 확인해주세요.');
      }
    }

    function toggleReading(idx) {
      const el = document.getElementById('expand-' + idx);
      if (!el) return;
      const btn = el.previousElementSibling;
      if (el.style.display === 'none' || !el.style.display) {
        if (typeof gtag === 'function') gtag('event', 'reading_viewed');
        el.style.display = 'block';
        if (btn) btn.textContent = '접기';
      } else {
        el.style.display = 'none';
        if (btn) btn.textContent = '다시 보기';
      }
    }

    initMypage();
  </script>
</body>
</html>
