<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무지개 다리 너머 🌈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300&display=swap" rel="stylesheet">

  <!-- 카카오 애드핏 -->
  <script type="text/javascript" src="//t1.kakaocdn.net/kas/static/ba.min.js" async></script>

  <!-- ★ AdSense (리딩하단·하단배너용 — 교체 전까지 비활성) -->
  <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --card-w: 160px;
      --card-h: 270px;
      --text-main: #f0e6ff;
      --text-sub:  #c0aad8;
      --text-dim:  #8070a0;
      --border:    rgba(200,160,255,.22);
      --glass:     rgba(255,255,255,.04);
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 20% 10%, #2a0a4a 0%, #0d0d2b 40%, #0a1428 70%, #001a1a 100%);
      font-family: 'Noto Serif KR', serif;
      color: var(--text-main);
      overflow-x: hidden;
    }

    /* rainbow top bar */
    .rainbow-bar {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 200;
      background: linear-gradient(90deg, #ff6b6b,#ff9f43,#ffd32a,#0be881,#17c0eb,#7d5fff,#ef5777);
    }

    /* starfield */
    #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute; border-radius: 50%; background: white;
      animation: twinkle var(--d,3s) var(--delay,0s) infinite ease-in-out;
    }
    @keyframes twinkle {
      0%,100% { opacity:.15; transform:scale(1); }
      50%      { opacity:1;  transform:scale(1.6); }
    }

    /* floating petals */
    .petal {
      position: fixed; font-size:13px; opacity:0; pointer-events:none; z-index:1;
      animation: floatUp var(--fd,8s) var(--fdelay,0s) infinite linear;
    }
    @keyframes floatUp {
      0%   { transform:translateY(100vh) rotate(0deg);   opacity:0; }
      10%  { opacity:.35; }
      90%  { opacity:.25; }
      100% { transform:translateY(-10vh) rotate(360deg); opacity:0; }
    }

    /* layout */
    .page { position:relative; z-index:10; }
    .container { max-width:880px; margin:0 auto; padding:70px 22px 60px; }

    /* header */
    .header { text-align:center; margin-bottom:48px; }
    .header .icon {
      font-size:3.4rem; display:block; margin-bottom:16px;
      animation: floatIcon 4s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%,100% { transform:translateY(0) rotate(-5deg); }
      50%      { transform:translateY(-12px) rotate(5deg); }
    }
    .header h1 {
      font-size:clamp(1.8rem,5vw,2.7rem); font-weight:600; line-height:1.3;
      background:linear-gradient(135deg,#e8c4ff 0%,#c8e6ff 50%,#ffcce8 100%);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      margin-bottom:12px;
    }
    .header .sub { font-size:.92rem; color:var(--text-sub); line-height:1.9; font-weight:300; }

    /* glass panel */
    .glass {
      background:var(--glass); border:1px solid var(--border);
      border-radius:20px; backdrop-filter:blur(12px); padding:24px 26px;
    }


    /* inputs */
    input, textarea, select {
      width:100%;
      background:rgba(255,255,255,.07); border:1px solid var(--border);
      border-radius:12px; color:var(--text-main);
      padding:12px 16px; font-family:'Noto Serif KR',serif; font-size:.9rem;
      outline:none; transition:border-color .3s, box-shadow .3s;
    }
    input:focus, textarea:focus {
      border-color:rgba(180,100,255,.5);
      box-shadow:0 0 16px rgba(160,80,255,.18);
    }
    input::placeholder, textarea::placeholder { color:var(--text-dim); }

    .field-label { font-size:.86rem; color:#d0b0f0; margin-bottom:8px; display:block; }
    .input-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:16px; }
    textarea.question { min-height:100px; resize:vertical; line-height:1.8; }

    /* buttons */
    .btn-draw {
      width:100%; margin-top:20px; padding:17px;
      border:none; border-radius:16px; cursor:pointer;
      font-family:'Noto Serif KR',serif; font-size:1rem; color:white;
      background:linear-gradient(135deg,#7d5fff,#5f4bd8,#3db8e8);
      background-size:200% 200%; animation:gradShift 4s ease infinite;
      transition:transform .2s, box-shadow .2s; position:relative; overflow:hidden;
    }
    @keyframes gradShift {
      0%  { background-position:0% 50%; }
      50% { background-position:100% 50%; }
      100%{ background-position:0% 50%; }
    }
    .btn-draw:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 12px 30px rgba(108,92,231,.45); }
    .btn-draw:disabled { opacity:.5; cursor:not-allowed; animation:none; }
    .btn-draw::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.12) 50%,transparent 70%);
      transform:translateX(-100%); transition:transform .5s;
    }
    .btn-draw:hover::after { transform:translateX(100%); }

    .btn-small {
      padding:11px 20px; border-radius:11px; cursor:pointer;
      font-family:'Noto Serif KR',serif; font-size:.85rem; white-space:nowrap;
      transition:all .25s;
    }
    .btn-ghost {
      background:transparent; border:1px solid var(--border); color:var(--text-sub);
    }
    .btn-ghost:hover { background:rgba(200,160,255,.1); color:var(--text-main); }
    .btn-purple {
      background:rgba(180,100,255,.16); border:1px solid rgba(180,100,255,.32); color:#d8b4ff;
    }
    .btn-purple:hover { background:rgba(180,100,255,.26); }

    /* ── cards section ── */
    .cards-section { display:none; margin-top:48px; }
    .cards-section.show { display:block; }

    .spread-hint {
      text-align:center; font-size:.88rem; color:var(--text-sub);
      margin-bottom:28px; letter-spacing:.04em;
    }
    .spread-hint em { font-style:normal; animation:hintPulse 2s ease-in-out infinite; display:inline-block; }
    @keyframes hintPulse { 0%,100%{opacity:.6;} 50%{opacity:1;} }

    .cards-grid {
      display:flex; justify-content:center;
    }

    .card-slot { width:min(220px,65vw); text-align:center; }

    /* tarot card flip */
    .card-wrap { perspective:1000px; width:100%; aspect-ratio:350/572; }
    .tarot-card {
      width:100%; height:100%; position:relative;
      transform-style:preserve-3d;
      transition:transform .85s cubic-bezier(.4,.2,.2,1);
      cursor:pointer;
    }
    .tarot-card.flipped { transform:rotateY(180deg); cursor:default; }

    .card-face, .card-back {
      position:absolute; inset:0; border-radius:14px;
      backface-visibility:hidden; overflow:hidden;
    }

    /* card back */
    .card-back {
      background:linear-gradient(145deg,#16082c,#1e1060,#0a1530);
      border:1.5px solid rgba(160,100,230,.32);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
    }
    .cb-border {
      position:absolute; inset:9px; border-radius:9px;
      border:1px solid rgba(160,100,230,.18);
    }
    .cb-pattern {
      position:absolute; inset:18px; border-radius:6px;
      background-image:
        repeating-linear-gradient(45deg,rgba(140,80,220,.11) 0,rgba(140,80,220,.11) 1px,transparent 0,transparent 9px),
        repeating-linear-gradient(-45deg,rgba(140,80,220,.11) 0,rgba(140,80,220,.11) 1px,transparent 0,transparent 9px);
    }
    .cb-symbol { font-size:2.6rem; opacity:.22; position:relative; z-index:2; user-select:none; }
    .cb-glow {
      position:absolute; inset:0; border-radius:14px;
      background:radial-gradient(ellipse at 50% 40%,rgba(160,80,255,.2),transparent 65%);
    }
    .tarot-card:not(.flipped):hover .card-back {
      border-color:rgba(180,120,255,.6);
      box-shadow:0 0 22px rgba(160,80,255,.3);
    }

    /* card face with image */
    .card-face {
      border:1.5px solid rgba(200,160,255,.35);
      transform:rotateY(180deg);
      display:flex; flex-direction:column;
      background:#0d0820;
    }
    .card-img-box {
      flex:1; overflow:hidden; position:relative;
      display:flex; align-items:center; justify-content:center;
    }
    .card-img-box img {
      width:100%; height:100%; object-fit:contain; display:block;
      transition:opacity .4s;
    }
    .card-img-box.reversed img { transform:rotate(180deg); }
    .card-img-fallback {
      display:none; width:100%; height:100%;
      align-items:center; justify-content:center; flex-direction:column; gap:6px;
      background:linear-gradient(145deg,#1e0840,#16225a);
    }
    .card-img-fallback .fb-emoji { font-size:2.8rem; opacity:.6; }
    .card-img-fallback .fb-name  { font-size:.72rem; color:var(--text-sub); text-align:center; padding:0 8px; }

    /* shimmer while loading */
    .card-img-box::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(180,120,255,.08),transparent);
      animation:imgShimmer 1.5s infinite;
      pointer-events:none; z-index:1;
    }
    .card-img-box.loaded::before { display:none; }
    @keyframes imgShimmer {
      0%   { transform:translateX(-100%); }
      100% { transform:translateX(100%); }
    }

    .card-label {
      padding:7px 8px 8px;
      background:linear-gradient(0deg,rgba(8,2,20,.96),rgba(8,2,20,.75));
      text-align:center; flex-shrink:0;
    }
    .card-label-name { font-size:.72rem; color:#e0c8ff; font-weight:600; }
    .card-label-rv   {
      font-size:.62rem; color:#b898e0; margin-top:2px; letter-spacing:.03em;
    }

    /* face glow for upright vs reversed */
    .card-face.is-upright  { box-shadow:inset 0 0 20px rgba(180,120,255,.15); }
    .card-face.is-reversed { box-shadow:inset 0 0 20px rgba(100,140,255,.18); }

    /* loading */
    .loading-section { display:none; text-align:center; padding:44px 0; }
    .loading-section.show { display:block; }
    .orb {
      width:60px; height:60px; border-radius:50%; margin:0 auto 18px;
      background:radial-gradient(circle at 35% 35%,#d8a0ff,#5f2fa8);
      animation:orbPulse 2s ease-in-out infinite;
      box-shadow:0 0 28px rgba(160,80,255,.5);
    }
    @keyframes orbPulse {
      0%,100% { transform:scale(1);   box-shadow:0 0 28px rgba(160,80,255,.4); }
      50%      { transform:scale(1.2); box-shadow:0 0 48px rgba(180,100,255,.7); }
    }
    .loading-text { color:var(--text-sub); font-size:.9rem; line-height:2; }

    /* reading */
    .reading-section { display:none; margin-top:36px; }
    .reading-section.show { display:block; animation:fadeUp .8s ease; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }

    .reading-header { text-align:center; margin-bottom:22px; }
    .reading-header .ltr-icon { font-size:1.9rem; display:block; margin-bottom:7px; }
    .reading-header h3 { font-size:1.05rem; color:#e0c0ff; font-weight:400; }

    .chips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:20px; }
    .chip {
      font-size:.7rem; padding:4px 11px; border-radius:20px;
      background:rgba(180,100,255,.1); border:1px solid rgba(180,100,255,.22);
      color:#c8a8f0;
    }
    .chip.rv {
      background:rgba(100,140,255,.1); border-color:rgba(100,140,255,.22);
      color:#a8c0f8;
    }
    .chip.rv::before { content:'↕ '; }

    .reading-body {
      line-height:2.1; font-size:.93rem; color:#d8c8f0;
      white-space:pre-wrap; font-family:'Noto Serif KR',serif;
    }
    .reading-footer { text-align:center; margin-top:28px; }

    /* 2-stage reading */
    .letter-trigger { display:none; justify-content:center; margin-top:28px; }
    .btn-open-letter {
      padding:14px 32px; border-radius:14px; cursor:pointer;
      border:1px solid rgba(180,100,255,.4); background:rgba(180,100,255,.12);
      color:#e0c0ff; font-family:'Noto Serif KR',serif; font-size:.95rem;
      transition:all .25s;
      animation:letterPulse 2.4s ease-in-out infinite;
    }
    @keyframes letterPulse {
      0%,100% { box-shadow:0 0 0 rgba(180,100,255,0); }
      50%      { box-shadow:0 0 18px rgba(180,100,255,.38); }
    }
    .btn-open-letter:hover { background:rgba(180,100,255,.24); transform:translateY(-2px); }

    .letter-section { margin-top:24px; }
    .letter-divider {
      height:1px; margin-bottom:22px;
      background:linear-gradient(90deg,transparent,rgba(200,160,255,.28),transparent);
    }
    .letter-header { text-align:center; margin-bottom:16px; }
    .letter-header .ltr-icon { font-size:1.9rem; display:block; margin-bottom:7px; }
    .letter-header h3 { font-size:1.05rem; color:#e0c0ff; font-weight:400; }

    footer.site-footer {
      text-align:center; margin-top:60px; padding-bottom:38px;
      color:var(--text-dim); font-size:.76rem; line-height:2;
    }

    /* ── 카드 스프레드 ── */
    .spread-section { display:none; margin-top:40px; }
    .spread-section.show { display:block; animation:fadeUp .5s ease; }
    .spread-section.fading { animation:fadeOut .35s ease forwards; pointer-events:none; }
    @keyframes fadeOut { to { opacity:0; transform:translateY(-8px); } }

    .spread-header { text-align:center; margin-bottom:4px; padding:0 8px; }
    .spread-instruction { font-size:.88rem; color:var(--text-sub); margin-bottom:10px; }
    .spread-count {
      display:inline-block;
      background:rgba(180,100,255,.13); border:1px solid rgba(180,100,255,.28);
      padding:3px 14px; border-radius:20px; font-size:.82rem; color:#d0a0ff;
      transition:background .3s, border-color .3s, color .3s;
    }
    .spread-count.full {
      background:rgba(200,160,60,.18); border-color:rgba(200,160,60,.42); color:#f0c870;
    }

    /* fan spread */
    .fan-wrap {
      position:relative; width:100%; height:320px;
      overflow:visible; margin:16px 0 8px;
    }
    @media(max-width:580px) { .fan-wrap { height:175px; } }

    .fan-card {
      position:absolute; left:0; top:0; border-radius:8px;
      background:linear-gradient(145deg,#140826,#1c1058,#091228);
      border:1.5px solid rgba(130,80,210,.28);
      cursor:pointer; overflow:hidden;
      transform-origin:50% 50%;
      transition:transform .18s ease-out, border-color .12s, box-shadow .12s;
      will-change:transform;
      user-select:none; -webkit-user-select:none;
    }
    .fan-card:hover:not(.fan-selected):not(.fan-disabled) {
      border-color:rgba(180,120,255,.65);
      box-shadow:0 0 14px rgba(140,80,255,.4);
    }
    .fan-card.fan-selected {
      border-color:rgba(220,170,55,.8) !important;
      box-shadow:0 0 22px rgba(210,160,50,.6) !important;
    }
    .fan-card.fan-disabled:not(.fan-selected) { opacity:.2; pointer-events:none; }

    .sc-border {
      position:absolute; inset:6px; border-radius:5px;
      border:1px solid rgba(130,80,210,.14);
    }
    .sc-pattern {
      position:absolute; inset:12px;
      background-image:
        repeating-linear-gradient(45deg,rgba(120,70,200,.09) 0,rgba(120,70,200,.09) 1px,transparent 0,transparent 8px),
        repeating-linear-gradient(-45deg,rgba(120,70,200,.09) 0,rgba(120,70,200,.09) 1px,transparent 0,transparent 8px);
    }
    .sc-glow {
      position:absolute; inset:0;
      background:radial-gradient(ellipse at 50% 35%,rgba(140,70,230,.16),transparent 65%);
    }
    .sc-symbol {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      font-size:1.3rem; opacity:.16;
    }
    .fan-card.fan-selected .sc-symbol { opacity:.32; }

    /* reveal animation */
    .reveal { opacity:0; transform:translateY(18px); transition:opacity .6s,transform .6s; }
    .reveal.in { opacity:1; transform:translateY(0); }

    /* ── 전면 광고 (인터스티셜) ── */
    .itl-overlay {
      position:fixed; inset:0; z-index:2000;
      display:none; align-items:center; justify-content:center;
      background:radial-gradient(ellipse at 20% 10%,rgba(30,8,60,.97) 0%,rgba(10,10,35,.97) 50%,rgba(8,18,35,.97) 100%);
      backdrop-filter:blur(8px);
    }
    .itl-overlay.show { display:flex; animation:itlFadeIn .35s ease; }
    @keyframes itlFadeIn { from{opacity:0;} to{opacity:1;} }

    .itl-box {
      max-width:440px; width:92%;
      background:rgba(255,255,255,.04); border:1px solid rgba(200,160,255,.2);
      border-radius:22px; overflow:hidden;
      animation:itlUp .35s ease;
    }
    @keyframes itlUp { from{transform:translateY(18px);opacity:0;} to{transform:translateY(0);opacity:1;} }

    .itl-rainbow { height:3px; background:linear-gradient(90deg,#ff6b6b,#ff9f43,#ffd32a,#0be881,#17c0eb,#7d5fff,#ef5777); }

    .itl-header { text-align:center; padding:22px 22px 14px; }
    .itl-icon   { font-size:2rem; display:block; margin-bottom:8px; animation:floatIcon 3s ease-in-out infinite; }
    .itl-title  { font-size:.98rem; color:#e0c8ff; margin-bottom:5px; }
    .itl-sub    { font-size:.78rem; color:var(--text-dim); }

    .itl-ad-wrap { padding:0 18px 14px; min-height:100px; display:flex; align-items:center; justify-content:center; }
    .itl-ad-wrap > div { width:100%; }

    .itl-footer { padding:14px 22px 22px; text-align:center; }
    .itl-close-btn {
      padding:11px 30px; border-radius:12px; border:1px solid var(--border);
      background:transparent; color:var(--text-sub);
      font-family:'Noto Serif KR',serif; font-size:.88rem; cursor:pointer;
      transition:all .25s; min-width:150px;
    }
    .itl-close-btn:not(:disabled):hover { background:rgba(200,160,255,.12); color:var(--text-main); border-color:rgba(200,160,255,.4); }
    .itl-close-btn:disabled { opacity:.45; cursor:not-allowed; }

    /* ── 리딩 하단 광고 ── */
    .ad-in-reading {
      margin-top:24px; padding-top:18px;
      border-top:1px solid rgba(255,255,255,.06);
    }

    /* ── 하단 고정 배너 ── */
    .ad-sticky {
      position:fixed; bottom:0; left:0; right:0; z-index:100;
      background:rgba(8,4,20,.92); border-top:1px solid rgba(200,160,255,.1);
      backdrop-filter:blur(8px);
      padding:6px 40px 6px 16px;
      display:flex; align-items:center; justify-content:center;
      transform:translateY(100%); transition:transform .45s ease;
    }
    .ad-sticky.show { transform:translateY(0); }
    .ad-sticky-inner { flex:1; max-width:728px; }
    .ad-sticky-close {
      position:absolute; right:10px; top:50%; transform:translateY(-50%);
      width:26px; height:26px; border-radius:50%;
      background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.1);
      color:var(--text-dim); font-size:.72rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:background .2s; flex-shrink:0;
    }
    .ad-sticky-close:hover { background:rgba(255,255,255,.16); }

    /* 하단 배너 높이만큼 컨텐츠 여백 */
    body.has-sticky { padding-bottom:68px; }

    /* 공통 광고 레이블 */
    .ad-label {
      text-align:center; font-size:.62rem; color:var(--text-dim);
      letter-spacing:.1em; margin-bottom:6px;
    }

    /* responsive */
    @media(max-width:580px) {
      .cards-grid { grid-template-columns:1fr; }
      .card-slot  { max-width:190px; margin:0 auto; }
      .input-row  { grid-template-columns:1fr; }
    }
    @media(min-width:581px) and (max-width:760px) {
      --card-h:230px;
    }
  </style>
</head>

<body>
  <div class="rainbow-bar"></div>
  <div id="stars"></div>
  <div id="petals"></div>

  <!-- ★ 전면 광고 (인터스티셜) ── "다시 질문하기" 클릭 시 표시 -->
  <div class="itl-overlay" id="itlOverlay">
    <div class="itl-box">
      <div class="itl-rainbow"></div>
      <div class="itl-header">
        <span class="itl-icon">🌙</span>
        <p class="itl-title">잠시 쉬어가요</p>
        <p class="itl-sub">다음 리딩을 준비하는 동안 숨을 고르세요</p>
      </div>
      <div class="itl-ad-wrap">
        <div>
          <p class="ad-label">광 고</p>
          <ins class="kakao_ad_area" style="display:none;"
            data-ad-unit="DAN-foqz4jO1cBc5jQyZ"
            data-ad-width="320"
            data-ad-height="100"></ins>
        </div>
      </div>
      <div class="itl-footer">
        <button class="itl-close-btn" id="itlCloseBtn" disabled onclick="closeInterstitial()">
          <span id="itlCd">5</span>초 후 닫기
        </button>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="container">

      <div class="header reveal">

/* ── 78장 팬 스프레드 ── */
let shuffledDeck=[], selectedFromSpread=[];

function spreadConfig(){
  const mobile=window.innerWidth<580;
  const W=Math.min(836,window.innerWidth-44);
  return {
    R:       mobile?135:330,
    EXTRA:   mobile?0:70,      // circle center below container bottom (px)
    CARD_W:  mobile?28:42,
    CARD_H:  mobile?50:72,
    ARC_HALF:mobile?75:78,     // half-arc degrees each side
    containerH: mobile?175:320,
    containerW: W,
    cx: W/2,
    get cy(){ return this.containerH+this.EXTRA; }
  };
}

function applyArcPos(el, angle, cfg){
  const rad=angle*Math.PI/180;
  const x=cfg.cx+cfg.R*Math.sin(rad)-cfg.CARD_W/2;
  const y=cfg.cy-cfg.R*Math.cos(rad)-cfg.CARD_H/2;
  el.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg)`;
}

function showSpread(){
  shuffledDeck=[...CARDS].sort(()=>Math.random()-.5);
  selectedFromSpread=[];

  const wrap=document.getElementById('fanWrap');
  wrap.innerHTML='';

  const cfg=spreadConfig();
  const N=78;

  const SIGMA=10, MAX_PUSH=8;

  shuffledDeck.forEach((card,i)=>{
    const angle=-cfg.ARC_HALF+(i/(N-1))*cfg.ARC_HALF*2;
    const el=document.createElement('div');
    el.className='fan-card';
    el.dataset.i=i;
    el.dataset.baseAngle=angle.toFixed(3);
    el.style.width =cfg.CARD_W+'px';
    el.style.height=cfg.CARD_H+'px';
    el.style.zIndex=Math.round(100-Math.abs(angle));
    el.innerHTML=`<div class="sc-border"></div><div class="sc-pattern"></div><div class="sc-glow"></div><div class="sc-symbol">🐾</div>`;
    applyArcPos(el, angle, cfg);

    // 호버: 이 카드를 바깥쪽으로 띄우고 이웃 카드 살짝 물러나게
    el.addEventListener('mouseenter',()=>{
      if(el.classList.contains('fan-selected')||el.classList.contains('fan-disabled'))return;
      const rad=angle*Math.PI/180;
      const x=cfg.cx+(cfg.R+16)*Math.sin(rad)-cfg.CARD_W/2;
      const y=cfg.cy-(cfg.R+16)*Math.cos(rad)-cfg.CARD_H/2;
      el.style.transform=`translate(${x}px,${y}px) rotate(${angle}deg)`;
      el.style.zIndex=200;
      wrap.querySelectorAll('.fan-card:not(.fan-selected):not(.fan-disabled)').forEach(other=>{
        if(other===el)return;
        const ob=parseFloat(other.dataset.baseAngle);
        const diff=ob-angle;
        const g=Math.exp(-(diff*diff)/(2*SIGMA*SIGMA));
        const push=MAX_PUSH*g*(diff>=0?1:-1);
        applyArcPos(other,ob+push,cfg);
      });
    });

    // 마우스 떠나면 전체 복원
    el.addEventListener('mouseleave',()=>{
      if(el.classList.contains('fan-selected')||el.classList.contains('fan-disabled'))return;
      wrap.querySelectorAll('.fan-card:not(.fan-selected):not(.fan-disabled)').forEach(other=>{
        const ob=parseFloat(other.dataset.baseAngle);
        applyArcPos(other,ob,cfg);
        other.style.zIndex=Math.round(100-Math.abs(ob));
      });
    });

    el.addEventListener('click',()=>pickCard(i));
    wrap.appendChild(el);
  });

  const countEl=document.getElementById('spreadCount');
  countEl.textContent='카드를 골라주세요'; countEl.classList.remove('full');
  const sec=document.getElementById('spreadSection');
  sec.classList.remove('fading'); sec.classList.add('show');
  setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),120);
}

function pickCard(i){
  if(selectedFromSpread.length>=1)return;
  selectedFromSpread.push(i);
  const el=document.querySelector(`.fan-card[data-i="${i}"]`);
  el.classList.add('fan-selected');
  // 선택된 카드를 호 바깥(중심에서 멀어지는 방향)으로 16px 띄우기
  const cfg=spreadConfig();
  const base=parseFloat(el.dataset.baseAngle);
  const rad=base*Math.PI/180;
  const x=cfg.cx+(cfg.R+16)*Math.sin(rad)-cfg.CARD_W/2;
  const y=cfg.cy-(cfg.R+16)*Math.cos(rad)-cfg.CARD_H/2;
  el.style.transform=`translate(${x}px,${y}px) rotate(${base}deg)`;
  el.style.zIndex=202;

  const countEl=document.getElementById('spreadCount');
  countEl.textContent='✓ 선택됨'; countEl.classList.add('full');

  setTimeout(()=>{
    document.querySelectorAll('.fan-card:not(.fan-selected)').forEach(e=>e.classList.add('fan-disabled'));
  },200);
  setTimeout(transitionToCards,850);
}

function transitionToCards(){
  drawn=[shuffledDeck[selectedFromSpread[0]]];
  drawnRv=[Math.random()<0.3];

  const spreadSec=document.getElementById('spreadSection');
  spreadSec.classList.add('fading');
  setTimeout(()=>{
    spreadSec.classList.remove('show','fading');
    renderCards();
    const cardSec=document.getElementById('cardsSection');
    cardSec.classList.add('show');
    setTimeout(()=>cardSec.scrollIntoView({behavior:'smooth',block:'start'}),100);

}

let _pendingLetter='';

async function fetchReading(){
  document.getElementById('loadingSection').classList.add('show');
  setTimeout(()=>document.getElementById('loadingSection').scrollIntoView({behavior:'smooth',block:'center'}),80);

  const petName    = document.getElementById('petName').value.trim()    || '반려동물';
  const ownerTitle = document.getElementById('ownerTitle').value.trim() || '보호자';
  const question   = document.getElementById('question').value.trim();
  const card=drawn[0], rv=drawnRv[0];

  const systemPrompt=`당신은 무지개 다리 너머로 떠난 반려동물의 영혼과 연결하는 타로 채널러입니다.
응답은 반드시 두 부분으로 구분합니다.

[1부: 카드 해석]
이 카드가 어떤 카드인지, 어떤 의미를 가지는지 간결하게 설명합니다. 그 다음, 보호자의 질문과 연결하여 이 카드를 따뜻하게 해석합니다. 2~4문장.

---LETTER---

[2부: 반려동물의 편지]
반려동물이 1인칭으로 직접 보호자에게 쓰는 짧은 편지. 카드의 의미에 기반해서만 씁니다.
- 종(種)에 따른 신체 표현 절대 금지 (꼬리, 발, 냐옹, 멍멍 등 특정 동물 한정 표현 사용 불가)
- 감정과 영혼의 언어만 사용 (예: "느껴져", "기억해", "곁에 있어", "사랑해")
- 역방향 카드는 따뜻한 위로로만 해석
- 200자 내외, 간결하게`;

  const userPrompt=`반려동물 이름: ${petName}
보호자 호칭: "${ownerTitle}"
보호자의 질문: "${question}"

오늘 뽑힌 카드: ${card.name}(${card.en}) — ${rv?'역방향':'정방향'}
정방향 키워드: ${card.upKw}
역방향 키워드: ${card.rvKw}

---LETTER--- 구분자를 포함하여 두 부분으로 정확히 나누어 작성해주세요.`;

  try{
    const res=await fetch('/.netlify/functions/tarot',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:systemPrompt,
        messages:[{role:'user',content:userPrompt}],
      }),
    });
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
    const data=await res.json();
    const full=data.content?.[0]?.text||'';
    const parts=full.split('---LETTER---');
    showReading(petName,(parts[0]||'').trim(),(parts[1]||'').trim());
  }catch(err){
    showReading(petName,'메시지를 전달하는 중 오류가 발생했습니다.\n\n잠시 후 다시 시도해주세요.','');
  }
}

function showReading(petName,interpretation,letter){
  document.getElementById('loadingSection').classList.remove('show');
  _pendingLetter=letter;

  const petN=document.getElementById('petName').value.trim()||petName;
  const rv=drawnRv[0];
  document.getElementById('readingTitle').textContent=`${drawn[0].name} ${rv?'(역방향)':'(정방향)'}`;

  const chips=document.getElementById('chipRow');

  const body=document.getElementById('readingBody');
  body.textContent='';
  document.getElementById('letterTrigger').style.display='none';
  document.getElementById('letterSection').style.display='none';
  document.getElementById('adInReading').style.display='none';
  document.getElementById('readingFooter').style.display='none';

  const sec=document.getElementById('readingSection');
  sec.classList.add('show');
  setTimeout(()=>sec.scrollIntoView({behavior:'smooth',block:'start'}),100);

  const chars=[...interpretation];
  let idx=0;
  (function type(){
    if(idx<chars.length){ body.textContent+=chars[idx++]; setTimeout(type,16); }
    else { setTimeout(()=>{ document.getElementById('letterTrigger').style.display='flex'; },400); }
  })();
}

function openLetter(){
  document.getElementById('letterTrigger').style.display='none';
  const petN=document.getElementById('petName').value.trim()||'반려동물';
  document.getElementById('letterTitle').textContent=`${petN}의 편지`;

  const ls=document.getElementById('letterSection');
  ls.style.display='block';
  ls.scrollIntoView({behavior:'smooth',block:'start'});

  const body=document.getElementById('letterBody');
  body.textContent='';
  if(!_pendingLetter){
    body.textContent='편지를 받아오지 못했습니다.';
    showReadingFooter(); return;
  }
  const chars=[..._pendingLetter];
  let idx=0;
  (function type(){
    if(idx<chars.length){ body.textContent+=chars[idx++]; setTimeout(type,20); }
    else showReadingFooter();
  })();
}

  document.getElementById('adInReading').style.display='block';
  document.getElementById('readingFooter').style.display='block';
