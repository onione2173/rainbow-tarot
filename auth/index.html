<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 / 회원가입 — 펫타로</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZDTC39TEKD"></script>
  <script>
    window.dataLayer=window.dataLayer||[];
    function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date()); gtag('config','G-ZDTC39TEKD');
  </script>

  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --text-main:#f0e6ff; --text-sub:#c0aad8; --text-dim:#8070a0;
    }
    body{
      min-height:100vh;
      background:radial-gradient(ellipse at 20% 10%,#2a0a4a 0%,#0d0d2b 40%,#0a1428 70%,#001a1a 100%);
      font-family:'Noto Serif KR',serif;
      color:var(--text-main);
    }
    .rainbow-bar{
      position:fixed;top:0;left:0;right:0;height:3px;z-index:300;
      background:linear-gradient(90deg,#ff6b6b,#ff9f43,#ffd32a,#0be881,#17c0eb,#7d5fff,#ef5777);
    }
    .site-header{
      position:sticky;top:3px;z-index:200;
      background:rgba(10,8,28,.92);backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(200,160,255,.1);
      height:56px;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
    }
    .header-back{
      font-size:.82rem;color:var(--text-dim);text-decoration:none;
      font-family:'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:4px;
    }
    .header-back:hover{color:var(--text-sub);}
    .header-brand{
      font-size:1.15rem;font-weight:600;text-decoration:none;
      background:linear-gradient(135deg,#e8c4ff 0%,#c8e6ff 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }

    .page{
      min-height:calc(100vh - 59px);
      display:flex;align-items:center;justify-content:center;
      padding:40px 20px 60px;
    }
    .auth-card{
      width:100%;max-width:420px;
    }

    .auth-logo{
      font-size:2.8rem;margin-bottom:20px;text-align:center;display:block;
    }
    .auth-title{
      font-size:1.6rem;font-weight:600;color:#e8d0ff;
      margin-bottom:10px;line-height:1.3;
    }
    .auth-sub{
      font-size:.88rem;color:var(--text-sub);line-height:1.8;
      font-family:'Noto Sans KR',sans-serif;font-weight:300;
      margin-bottom:40px;
    }

    .kakao-btn{
      display:flex;align-items:center;justify-content:center;gap:10px;
      width:100%;padding:16px 20px;
      background:#FEE500;border:none;border-radius:14px;
      font-size:1rem;font-weight:700;color:#191919;
      cursor:pointer;font-family:'Noto Sans KR',sans-serif;
      transition:background .2s,transform .15s;
      letter-spacing:.01em;
    }
    .kakao-btn:hover{background:#f5db00;transform:translateY(-1px);}
    .kakao-btn:active{transform:translateY(0);}
    .kakao-icon{
      width:22px;height:22px;flex-shrink:0;
    }

    .divider{
      display:flex;align-items:center;gap:12px;
      margin:24px 0;color:var(--text-dim);font-size:.75rem;
      font-family:'Noto Sans KR',sans-serif;
    }
    .divider::before,.divider::after{
      content:'';flex:1;height:1px;background:rgba(200,160,255,.15);
    }

    .terms-notice{
      text-align:center;font-size:.75rem;
      color:var(--text-dim);font-family:'Noto Sans KR',sans-serif;
      line-height:1.9;margin-top:28px;
    }
    .terms-notice a{
      color:var(--text-sub);text-decoration:underline;text-underline-offset:3px;
    }
    .terms-notice a:hover{color:var(--text-main);}

    .already-msg{
      display:none;text-align:center;
      margin-top:24px;
      background:rgba(100,200,120,.08);
      border:1px solid rgba(100,200,120,.2);
      border-radius:14px;padding:20px 16px;
    }
    .already-msg p{font-size:.85rem;color:#90d8a0;font-family:'Noto Sans KR',sans-serif;margin-bottom:14px;}
    .btn-mypage{
      display:inline-block;padding:10px 28px;
      background:rgba(100,200,120,.14);border:1px solid rgba(100,200,120,.3);
      border-radius:22px;color:#90d8a0;text-decoration:none;
      font-size:.82rem;font-family:'Noto Sans KR',sans-serif;
      transition:all .2s;
    }
    .btn-mypage:hover{background:rgba(100,200,120,.24);}

    .setup-notice{
      display:none;text-align:center;
      background:rgba(255,180,50,.07);border:1px solid rgba(255,180,50,.22);
      border-radius:14px;padding:20px 16px;margin-bottom:24px;
    }
    .setup-notice p{font-size:.8rem;color:#f0c878;font-family:'Noto Sans KR',sans-serif;line-height:1.7;}
  </style>
</head>
<body>
  <div class="rainbow-bar"></div>

  <header class="site-header">
    <a href="javascript:history.back()" class="header-back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    </a>
    <a href="/" class="header-brand">펫타로</a>
    <div style="width:40px"></div>
  </header>

  <div class="page">
    <div class="auth-card">
      <span class="auth-logo">🐾</span>
      <h1 class="auth-title">간단히 가입하고<br>나만의 리딩을 저장하세요.</h1>
      <p class="auth-sub">회원가입과 로그인이 동시에 처리돼요.<br>카카오 계정만 있으면 바로 시작할 수 있어요.</p>

      <div class="setup-notice" id="setupNotice">
        <p>⚙️ 서비스 준비 중입니다.<br>곧 카카오 로그인이 활성화될 예정이에요.</p>
      </div>

      <button class="kakao-btn" id="kakaoBtn" onclick="doKakaoLogin()">
        <svg class="kakao-icon" viewBox="0 0 24 24" fill="#191919">
          <path d="M12 3C6.477 3 2 6.477 2 10.75c0 2.718 1.637 5.1 4.107 6.516l-1.048 3.856 4.514-2.97c.786.14 1.59.21 2.427.21 5.523 0 10-3.477 10-7.75S17.523 3 12 3z"/>
        </svg>
        카카오로 시작하기
      </button>

      <div class="divider">또는</div>

      <div class="terms-notice">
        가입하면 <a href="/terms/">이용약관</a> 및 <a href="/privacy/">개인정보 처리방침</a>에<br>
        동의하게 됩니다.
      </div>

      <div class="already-msg" id="alreadyMsg">
        <p>이미 로그인되어 있어요.</p>
        <a href="/mypage/" class="btn-mypage">마이페이지 가기</a>
      </div>
    </div>
  </div>

  <script src="/assets/auth.js"></script>
  <script>
    async function initAuthPage() {
      const user = await getUser();
      if (user) {
        document.getElementById('kakaoBtn').style.display = 'none';
        document.getElementById('alreadyMsg').style.display = 'block';
        document.querySelector('.divider').style.display = 'none';
      }
      const configured = typeof SUPABASE_URL !== 'undefined' && !SUPABASE_URL.includes('YOUR_PROJECT');
      if (!configured) {
        document.getElementById('setupNotice').style.display = 'block';
      }
    }
    async function doKakaoLogin() {
      if (typeof gtag === 'function') gtag('event', 'login_initiated', { method: 'kakao' });
      document.getElementById('kakaoBtn').textContent = '연결 중...';
      document.getElementById('kakaoBtn').disabled = true;
      await signInWithKakao('/mypage/');
      document.getElementById('kakaoBtn').textContent = '카카오로 시작하기';
      document.getElementById('kakaoBtn').disabled = false;
    }
    initAuthPage();
  </script>
</body>
</html>
