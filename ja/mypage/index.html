  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --text-main:#f0e6ff; --text-sub:#c0aad8; --text-dim:#8070a0;
      --card-bg:rgba(255,255,255,.04); --card-border:rgba(200,160,255,.15);
    }
    body{
      min-height:100vh;
      background:radial-gradient(ellipse at 20% 10%,#2a0a4a 0%,#0d0d2b 40%,#0a1428 70%,#001a1a 100%);
      font-family:'Noto Serif JP',serif;
      color:var(--text-main);
    }
    .rainbow-bar{
      position:fixed;top:0;left:0;right:0;height:3px;z-index:300;
      background:linear-gradient(90deg,#ff6b6b,#ff9f43,#ffd32a,#0be881,#17c0eb,#7d5fff,#ef5777);
    }
    .site-header{
      position:sticky;top:3px;z-index:200;
      background:rgba(10,8,28,.92);backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(200,160,255,.1);
      height:56px;display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;
    }
    .header-brand{display:flex;align-items:center;gap:9px;text-decoration:none;}
    .brand-icon{font-size:1.35rem;}
    .brand-name{
      font-size:1.15rem;font-weight:600;
      background:linear-gradient(135deg,#e8c4ff 0%,#c8e6ff 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .hamburger-btn{
      background:none;border:none;cursor:pointer;
      display:flex;flex-direction:column;gap:5px;
      padding:8px;margin-right:-8px;
    }
    .hamburger-btn span{
      display:block;width:22px;height:2px;
      background:#c0aad8;border-radius:2px;
    }
    .menu-overlay{
      position:fixed;inset:0;z-index:998;
      background:rgba(0,0,0,.55);
      opacity:0;pointer-events:none;transition:opacity .3s;
    }
    .menu-overlay.show{opacity:1;pointer-events:all;}
    .menu-drawer{
      position:fixed;top:0;right:-100%;
      width:min(300px,82vw);height:100vh;z-index:999;
      background:linear-gradient(160deg,#130428 0%,#0b1032 100%);
      border-left:1px solid rgba(200,160,255,.15);
      overflow-y:auto;transition:right .3s ease;
    }
    .menu-drawer.show{right:0;}
    .menu-top{display:flex;align-items:center;justify-content:space-between;padding:24px 20px 18px;}
    .menu-label{font-size:1.25rem;font-weight:700;color:#f0e6ff;font-family:'Noto Sans JP',sans-serif;}
    .menu-close-btn{background:none;border:none;color:#8070a0;font-size:1.1rem;cursor:pointer;padding:6px;line-height:1;}
    .menu-hr{border:none;border-top:1px solid rgba(200,160,255,.12);margin:0 0 6px;}
    .menu-item{
      display:flex;align-items:center;
      padding:16px 20px;font-size:1rem;color:#f0e6ff;
      text-decoration:none;cursor:pointer;
      border:none;background:none;width:100%;
      text-align:left;font-family:'Noto Serif JP',serif;
      transition:background .15s;line-height:1.4;
    }
    .menu-item:hover{background:rgba(255,255,255,.04);}
    .menu-item-disabled{color:#8070a0;cursor:default;pointer-events:none;}
    .menu-item-disabled:hover{background:none;}
    .chip-soon{
      margin-left:8px;font-size:.65rem;padding:2px 9px;
      border-radius:10px;background:rgba(180,100,255,.12);
      border:1px solid rgba(180,100,255,.28);color:#c0a0ff;
      font-family:'Noto Sans JP',sans-serif;
    }

    .page{position:relative;z-index:10;}
    .wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px;}

    /* Loading / auth gate */
    .auth-gate{
      text-align:center;padding:80px 20px;
    }
    .auth-gate p{font-size:.9rem;color:var(--text-sub);margin-bottom:20px;font-family:'Noto Sans JP',sans-serif;line-height:1.8;}
    .google-btn{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 28px;background:#fff;border:none;
      border-radius:24px;color:#333;
      font-size:.9rem;font-weight:600;font-family:'Noto Sans JP',sans-serif;
      cursor:pointer;transition:all .2s;
    }
    .google-btn:hover{background:#f0f0f0;}
    .google-btn:disabled{opacity:.6;cursor:default;}
    .google-icon{width:20px;height:20px;flex-shrink:0;}

    /* Link banner (anonymous user with readings) */
    .link-banner{
      background:rgba(100,180,255,.07);border:1px solid rgba(100,180,255,.22);
      border-radius:18px;padding:20px;margin-bottom:24px;text-align:center;
    }
    .link-banner p{font-size:.84rem;color:#a0d8ff;font-family:'Noto Sans JP',sans-serif;line-height:1.7;margin-bottom:14px;}
    .link-error{display:none;font-size:.78rem;color:#f09090;font-family:'Noto Sans JP',sans-serif;margin-top:10px;line-height:1.6;}

    /* User profile section */
    .profile-section{
      display:flex;align-items:center;gap:16px;
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:18px;padding:22px 20px;margin-bottom:24px;

    .profile-avatar{
      width:52px;height:52px;border-radius:50%;
      background:linear-gradient(135deg,#7d5fff,#ef5777);
      display:flex;align-items:center;justify-content:center;
      font-size:1.4rem;flex-shrink:0;overflow:hidden;
    }
    .profile-avatar img{width:100%;height:100%;object-fit:cover;}
    .profile-name{font-size:1rem;font-weight:600;color:var(--text-main);margin-bottom:3px;}
    .profile-email{font-size:.78rem;color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;}

    /* Section card */
    .section-card{
      background:var(--card-bg);border:1px solid var(--card-border);
      border-radius:18px;padding:24px 20px;margin-bottom:16px;
    }
    .section-title{
      font-size:.78rem;font-weight:600;color:var(--text-dim);
      letter-spacing:.1em;text-transform:uppercase;
      font-family:'Noto Sans JP',sans-serif;margin-bottom:16px;
    }

    /* Reading history */
    .history-empty{
      text-align:center;padding:24px 0 8px;
    }
    .history-empty-icon{font-size:2.5rem;display:block;margin-bottom:12px;}
    .history-empty p{
      font-size:.82rem;color:var(--text-dim);
      font-family:'Noto Sans JP',sans-serif;line-height:1.8;
    }
    .history-item{
      border-bottom:1px solid rgba(200,160,255,.1);
      padding:14px 0;
    }
    .history-item:last-child{border-bottom:none;padding-bottom:0;}
    .history-item-title{font-size:.88rem;color:var(--text-main);margin-bottom:4px;}
    .history-item-meta{font-size:.74rem;color:var(--text-dim);font-family:'Noto Sans JP',sans-serif;}
    .badge-pending{
      display:inline-block;margin-left:8px;padding:2px 8px;
      background:rgba(255,160,60,.12);border:1px solid rgba(255,160,60,.35);
      border-radius:10px;color:#ffb86c;font-size:.68rem;
      font-family:'Noto Sans JP',sans-serif;vertical-align:middle;
    }
    .history-item-expires{
      font-size:.7rem;color:var(--text-dim);
      font-family:'Noto Sans JP',sans-serif;margin-top:2px;
    }
    .btn-resume{
      display:inline-block;margin-top:10px;padding:7px 16px;
      background:rgba(255,160,60,.14);border:1px solid rgba(255,160,60,.38);
      border-radius:12px;color:#ffb86c;font-size:.78rem;
      font-family:'Noto Sans JP',sans-serif;cursor:pointer;
    }
    .btn-view{
      display:inline-block;margin-top:10px;padding:7px 16px;
      background:rgba(170,90,255,.12);border:1px solid rgba(170,90,255,.3);
      border-radius:12px;color:#d0aaff;font-size:.78rem;
      font-family:'Noto Sans JP',sans-serif;cursor:pointer;border:1px solid rgba(170,90,255,.3);
    }
    .reading-expand{
      margin-top:14px;padding:14px;
      background:rgba(255,255,255,.03);border:1px solid rgba(200,160,255,.1);
      border-radius:10px;font-size:.82rem;color:var(--text-sub);
      line-height:1.85;font-family:'Noto Serif JP',serif;
      white-space:pre-wrap;display:none;
    }

    /* Link list */
    .link-list a,.link-list button{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 0;border-bottom:1px solid rgba(200,160,255,.08);
      color:var(--text-sub);text-decoration:none;
      font-size:.88rem;font-family:'Noto Sans JP',sans-serif;
      background:none;border-left:none;border-right:none;border-top:none;
      width:100%;text-align:left;cursor:pointer;
      transition:color .2s;
    }
    .link-list a:last-child,.link-list button:last-child{border-bottom:none;}
    .link-list a:hover,.link-list button:hover{color:var(--text-main);}
    .link-arrow{font-size:.75rem;opacity:.5;}

    .logout-btn{
      display:block;width:100%;padding:14px;margin-top:16px;
      background:none;border:1px solid rgba(200,160,255,.15);
      border-radius:14px;color:var(--text-dim);
      font-size:.85rem;font-family:'Noto Sans JP',sans-serif;
      cursor:pointer;transition:all .2s;text-align:center;
    }
    .logout-btn:hover{border-color:rgba(200,160,255,.3);color:var(--text-sub);}
  </style>
</head>

  <script src="/assets/auth.js"></script>
  <script>
    const L = {
      statusPending: '未決済',
      statusGenerating: '作成中',
      statusError: 'エラー',
      btnResume: '決済を続ける',
      btnCheck: '完了を確認する',
      btnRetry: 'もう一度試す',
      btnView: 'リーディングを見る',
      btnCollapse: '閉じる',
      stillGenerating: 'まだ作成中です。しばらくしてからもう一度ご確認ください。',
      expires: '保存期限',
      guest: 'ゲスト',
      defaultTitle: 'リーディング',
      dateLocale: 'ja-JP',
      home: '/ja/',
      deepReading: '/ja/deep-reading/',
      linkErrAlready: 'このGoogleアカウントは別のプロフィールで使用されているため連携できません。リーディングは引き続きこのブラウザでご覧いただけます。',
      linkErrGeneric: 'アカウントを連携できませんでした。しばらくしてからもう一度お試しください。'
    };

    async function initMypage() {
      const user = await getUser();
      if (typeof gtag === 'function') gtag('event', 'mypage_view', { logged_in: !!user && !user.is_anonymous });

      if (!user) {
        document.getElementById('authGate').style.display = 'block';
        return;
      }

      document.getElementById('mainContent').style.display = 'block';

      if (user.is_anonymous) {
        // 익명 세션: 이 브라우저의 리딩은 보이지만, 계정 연결을 권한다
        document.getElementById('linkBanner').style.display = 'block';
      } else {
        const meta = user.user_metadata || {};
        const name = meta.full_name || meta.name || meta.preferred_username || L.guest;
        document.getElementById('profileSection').style.display = 'flex';
        document.getElementById('profileName').textContent = name;
        document.getElementById('profileEmail').textContent = user.email || '';
        const avatar = meta.avatar_url || meta.picture || '';
        if (avatar) document.getElementById('profileAvatar').innerHTML = `<img src="${avatar}" alt="">`;
        document.getElementById('logoutBtn').style.display = 'block';
      }

      if (!window._sb) return;
      const { data: readings } = await window._sb
        .from('reading_history')
        .select('*')
        .eq('user_id', user.id)
        .order('created_at', { ascending: false })
        .limit(20);

      if (!readings || readings.length === 0) return;
      const now = Date.now();
      const visible = readings.filter(r => {
        if ((r.status === '결제 필요' || r.status === '결제 대기' || r.status === '결제 완료' || r.status === '생성 중' || r.status === '오류') && r.expires_at) {
          return new Date(r.expires_at).getTime() > now;
        }
        return true;
      });
      if (visible.length === 0) return;

      const list = document.getElementById('historyList');
      list.innerHTML = visible.map((r, i) => {
        const isPending = r.status === '결제 필요' || r.status === '결제 대기';
        const isGenerating = r.status === '생성 중' || r.status === '결제 완료';
        const isError = r.status === '오류';
        const title = escHtml(r.spread_type || r.reading_type || L.defaultTitle);
        const petName = r.pet_name ? ` — ${escHtml(r.pet_name)}` : '';
        const badge = isPending
          ? `<span class="badge-pending">${L.statusPending}</span>`
          : isGenerating ? `<span class="badge-pending" style="color:#a0d8ff;border-color:rgba(100,180,255,.35);background:rgba(100,180,255,.08)">${L.statusGenerating}</span>`
          : isError ? `<span class="badge-pending" style="color:#f09090;border-color:rgba(240,100,100,.35);background:rgba(240,100,100,.08)">${L.statusError}</span>`
          : '';
        const expireStr = (isPending || isGenerating || isError) && r.expires_at
          ? `<div class="history-item-expires">${L.expires}: ${new Date(r.expires_at).toLocaleDateString(L.dateLocale)}</div>`
          : '';
        const actionBtn = isPending
          ? `<button class="btn-resume" onclick="resumeReading(${i})">${L.btnResume}</button>`
          : isGenerating
            ? `<button class="btn-resume" onclick="checkGenerating(${i})" style="background:rgba(100,180,255,.12);color:#a0d8ff;border-color:rgba(100,180,255,.3)">${L.btnCheck}</button>`
          : isError
            ? `<button class="btn-resume" onclick="resumeReading(${i})" style="background:rgba(200,160,255,.12);color:#c8a8f0;border-color:rgba(200,160,255,.3)">${L.btnRetry}</button>`
          : r.full_reading
            ? `<button class="btn-view" onclick="toggleReading(${i})">${L.btnView}</button>`
            : '';
        const expandDiv = (!isPending && r.full_reading)
          ? `<div class="reading-expand" id="expand-${i}">${renderMd(r.full_reading)}</div>`
          : '';
        return `
          <div class="history-item">
            <div class="history-item-title">${title}${petName}${badge}</div>
            <div class="history-item-meta">${new Date(r.created_at).toLocaleDateString(L.dateLocale)}</div>
            ${expireStr}
            ${actionBtn}
            ${expandDiv}
          </div>
        `;
      }).join('');
      window._readings = visible;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderMd(text) {
      return escHtml(text)
        .replace(/^## (.+)$/gm, '<strong style="display:block;margin-top:14px;color:#e8c4ff">$1</strong>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>');
    }

    // 리딩의 스냅샷 locale에 맞는 deep-reading 페이지로 복귀한다
    function deepReadingPathFor(snap) {
      if (snap && (snap.locale === 'en' || snap.locale === 'ja')) return `/${snap.locale}/deep-reading/`;
      if (snap && snap.locale === 'ko') return '/deep-reading/';
      return L.deepReading;
    }

    function resumeReading(idx) {
      if (typeof gtag === 'function') gtag('event', 'reading_resumed');
      const r = window._readings?.[idx];
      if (!r || !r.full_reading) return;
      let snap;
      try { snap = JSON.parse(r.full_reading); } catch { return; }
      if (!snap._pending) return;
      localStorage.setItem('petarot_dr', JSON.stringify({
        ...snap,
        readingId: r.id,
        _pending: undefined,
        _resumePending: true,
        _savedAt: Date.now()
      }));
      window.location.href = deepReadingPathFor(snap);
    }

    async function checkGenerating(idx) {
      const r = window._readings?.[idx];
      if (!r?.id) return;
      const { data } = await window._sb.from('reading_history').select('status,full_reading').eq('id', r.id).single();
      if (!data) return;
      if (data.status === 'completed') {
        window.location.reload();
      } else {
        alert(L.stillGenerating);
      }
    }

    function toggleReading(idx) {
      const el = document.getElementById('expand-' + idx);
      if (!el) return;
      const btn = el.previousElementSibling;
      if (el.style.display === 'none' || !el.style.display) {
        if (typeof gtag === 'function') gtag('event', 'reading_viewed');
        el.style.display = 'block';
        if (btn) btn.textContent = L.btnCollapse;
      } else {
        el.style.display = 'none';
        if (btn) btn.textContent = L.btnView;
      }
    }

    async function doGoogleLogin() {
      if (typeof gtag === 'function') gtag('event', 'login_initiated', { method: 'google' });
      const btn = document.getElementById('googleBtn');
      btn.disabled = true;
      const { error } = await signInWithGoogle(window.location.pathname) || {};
      if (error) btn.disabled = false;
    }

    async function doGoogleLink() {
      if (typeof gtag === 'function') gtag('event', 'link_account_initiated', { method: 'google' });
      const btn = document.getElementById('linkBtn');
      btn.disabled = true;
      const { error } = await linkGoogleIdentity(window.location.pathname) || {};
      if (error) {
        btn.disabled = false;
        const el = document.getElementById('linkError');
        el.textContent = /already/i.test(error.message || '') ? L.linkErrAlready : L.linkErrGeneric;
        el.style.display = 'block';
      }
    }

    // 메뉴의 로그아웃(miLogout)은 auth.js가 signOutUser로 바인딩한다
    function doSignOut() { signOutUser(); }

    initMypage();
  </script>
</body>
</html>
