[build]
  command = "node scripts/build.js"
  publish = "."
  # Skip deploys (and save build credits) when only non-site files changed:
  # marketing queue/state, journals, CI workflows, the posting scripts, HANDOFF.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude).github' ':(exclude)marketing' ':(exclude)log' ':(exclude)scripts/fukumaru' ':(exclude)HANDOFF.md'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY"

[dev]
  port = 3000
