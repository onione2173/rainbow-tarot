<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 배경: 연한 라벤더 라운드 사각형 -->
  <rect width="100" height="100" rx="22" fill="#f5eeff"/>

  <!-- 흰색 털 뭉치 (paw 뒤 배경) -->
  <circle cx="50" cy="62" r="33" fill="white"/>

  <!-- 발가락 콩 4개 -->
  <!-- 왼쪽 바깥 -->
  <ellipse cx="23" cy="48" rx="11" ry="10" fill="#FFB0C8"/>
  <!-- 왼쪽 안쪽 -->
  <ellipse cx="39" cy="35" rx="10.5" ry="10" fill="#FFB0C8"/>
  <!-- 오른쪽 안쪽 -->
  <ellipse cx="61" cy="35" rx="10.5" ry="10" fill="#FFB0C8"/>
  <!-- 오른쪽 바깥 -->
  <ellipse cx="77" cy="48" rx="11" ry="10" fill="#FFB0C8"/>

  <!-- 메인 발바닥 -->
  <ellipse cx="50" cy="70" rx="22" ry="19" fill="#FFB0C8"/>
</svg>
